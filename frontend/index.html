<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="اپلیکیشن چت بلادری فارسی با Socket.IO و React" />
    <title>BMS Real-time Chat</title>
    <!-- Preload font -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <!-- Capture the install prompt as early as possible (before the React bundle loads) -->
    <script>
      (function () {
        window.__deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__deferredInstallPrompt = e;
          try { window.dispatchEvent(new Event('pwa:beforeinstallprompt')); } catch (_) {}
        });
        window.addEventListener('appinstalled', function () {
          window.__deferredInstallPrompt = null;
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
